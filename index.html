<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Fikriye Pelin Kurtul-Vacek</title>
  <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
  <style>
    @import url('https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500&family=Playfair+Display:ital,wght@0,500;0,600;1,500&display=swap');
    :root { --ink:#23251f; --earth:#896b50; --paper:#f4f0e7; --line:rgba(35,37,31,.30); }
    * { box-sizing:border-box; }
    html,body { height:100%; margin:0; }
    body { background:var(--paper); color:var(--ink); font-family:"DM Sans",Arial,sans-serif; overflow:hidden; }
    .page { position:relative; min-height:100vh; display:flex; flex-direction:column; justify-content:space-between; padding:5.5vw 7vw 4.5vw; overflow:hidden; }
    main,footer { position:relative; z-index:1; }
    main { max-width:830px; margin:auto 0; padding:11vh 0; transform:translateY(-3vh); }
    h1 { margin:0; font-family:"Playfair Display",Georgia,serif; font-weight:500; font-size:clamp(47px,7.1vw,106px); line-height:.98; letter-spacing:-.045em; }
    h1 em { color:var(--earth); }
    .role { max-width:830px; margin:35px 0 0; font-size:clamp(15px,1.7vw,20px); line-height:1.55; letter-spacing:.005em; }
    .descriptor { max-width:830px; margin:20px 0 0; color:#595a52; font-size:14px; line-height:1.65; }
    .credential { margin:8px 0 0; color:#595a52; font-size:14px; line-height:1.65; }
    .progress { margin:22px 0 0; color:var(--earth); font-size:10px; font-weight:500; letter-spacing:.15em; text-transform:uppercase; }
    .places { margin:44px 0 0; width:calc(100vw - 14vw); position:relative; padding-top:34px; font-size:10px; font-weight:500; letter-spacing:.14em; text-transform:uppercase; }
    footer { display:none; }
    .section-line { position:absolute; top:0; left:0; width:100%; height:26px; }
    .section-line path { fill:none; stroke:var(--ink); stroke-width:1; opacity:.33; }
    @media (max-width:600px) {
      .page { padding:36px 28px 30px; }
      main { padding:7vh 0; transform:translateY(-2vh); }
      .role { margin-top:28px; }
      .places { width:calc(100vw - 56px); }
    }
  </style>
</head>
<body>
  <div class="page">
    <main>
      <h1>Fikriye Pelin<br><em>Kurtul-Vacek</em></h1>
      <p class="role">Architect &amp; Researcher in Earthen Architecture and Archaeological Systems</p>
      <p class="descriptor">Working across architecture, archaeology, material research, and socially engaged design.</p>
      <p class="credential">Building Biology Consultant</p>
      <p class="progress">Website in progress</p>
      <div class="places">
        <svg class="section-line" viewBox="0 0 1200 26" preserveAspectRatio="none" aria-hidden="true">
          <path d="M0 5 H248 L264 9 H620 L636 5 H945 L960 8 H1200" />
          <path d="M0 18 H154 L171 15 H425 L442 19 H783 L799 15 H1052 L1069 18 H1200" />
        </svg>
        Milan · Istanbul · Vienna · Mediterranean
      </div>
    </main>
  </div>
</body>
</html>
