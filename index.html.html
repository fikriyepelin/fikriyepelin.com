<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Fikriye Pelin Kurtul-Vacek</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500&family=Playfair+Display:ital,wght@0,500;0,600;1,500&display=swap');

    :root {
      --ink: #23251f;
      --earth: #896b50;
      --paper: #f4f0e7;
      --line: rgba(35, 37, 31, .30);
    }

    * { box-sizing: border-box; }

    html, body { height: 100%; margin: 0; }

    body {
      background: var(--paper);
      color: var(--ink);
      font-family: "DM Sans", Arial, sans-serif;
      overflow: hidden;
    }

    .page {
      position: relative;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      padding: 5.5vw 7vw 4.5vw;
      overflow: hidden;
    }

    .page::before {
      content: "";
      position: absolute;
      width: min(68vw, 920px);
      height: min(68vw, 920px);
      right: -25vw;
      bottom: -37vw;
      border: 1px solid var(--line);
      border-radius: 50%;
    }

    .page::after {
      content: "";
      position: absolute;
      width: min(47vw, 630px);
      height: min(47vw, 630px);
      right: -15vw;
      bottom: -26vw;
      border: 1px solid rgba(137, 107, 80, .55);
      border-radius: 50%;
    }

    .top, main, footer { position: relative; z-index: 1; }

    .top {
      display: flex;
      align-items: center;
      gap: 12px;
      font-size: 10px;
      font-weight: 500;
      letter-spacing: .16em;
      text-transform: uppercase;
    }

    .mark { width: 30px; height: 1px; background: var(--earth); }

    main { max-width: 830px; margin: auto 0; padding: 11vh 0; }

    h1 {
      margin: 0;
      font-family: "Playfair Display", Georgia, serif;
      font-weight: 500;
      font-size: clamp(47px, 7.1vw, 106px);
      line-height: .98;
      letter-spacing: -.045em;
    }

    h1 em { color: var(--earth); }

    .role {
      max-width: 560px;
      margin: 35px 0 0;
      font-size: clamp(15px, 1.7vw, 20px);
      line-height: 1.55;
      letter-spacing: .005em;
    }

    .descriptor {
      max-width: 575px;
      margin: 20px 0 0;
      color: #595a52;
      font-size: 14px;
      line-height: 1.65;
    }

    footer {
      display: flex;
      align-items: flex-end;
      justify-content: space-between;
      gap: 24px;
      border-top: 1px solid var(--line);
      padding-top: 17px;
      font-size: 10px;
      font-weight: 500;
      letter-spacing: .14em;
      line-height: 1.5;
      text-transform: uppercase;
    }

    .status { color: var(--earth); }

    @media (max-width: 600px) {
      .page { padding: 36px 28px 30px; }
      main { padding: 12vh 0; }
      .role { margin-top: 28px; }
      footer { align-items: flex-start; flex-direction: column; gap: 7px; }
      .page::before { width: 100vw; height: 100vw; right: -55vw; bottom: -55vw; }
      .page::after { width: 66vw; height: 66vw; right: -36vw; bottom: -36vw; }
    }
  </style>
</head>
<body>
  <div class="page">
    <div class="top"><span class="mark"></span> Fikriye Pelin</div>

    <main>
      <h1>Fikriye Pelin<br><em>Kurtul-Vacek</em></h1>
      <p class="role">Architect &amp; Researcher in Earthen Architecture and Archaeological Systems</p>
      <p class="descriptor">Working across architecture, archaeology, material research, and socially engaged design. Building Biology Consultant.</p>
    </main>

    <footer>
      <span>Vienna · Milan · Mediterranean</span>
      <span class="status">Website in progress · 2026</span>
    </footer>
  </div>
</body>
</html>
